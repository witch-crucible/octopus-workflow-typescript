<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MSW{% endblock %} · Magento Security Watcher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
  (function () {
    var t = null;
    try { t = localStorage.getItem("msw-theme"); } catch (e) { t = null; }
    if (t === "light" || t === "dark") {
      document.documentElement.setAttribute("data-theme", t);
    }
  })();
  </script>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <a class="brand-name" href="/">Magento Security Watcher</a>
      <span class="brand-mark">MSW · 内网只读看板</span>
    </div>
    <nav class="nav" aria-label="主导航">
      <a href="/" class="{{ 'active' if nav == '/' else '' }}">总览</a>
      <a href="/projects" class="{{ 'active' if nav.startswith('/projects') else '' }}">项目</a>
      <a href="/risks" class="{{ 'active' if nav.startswith('/risks') else '' }}">风险</a>
      <a href="/bulletins" class="{{ 'active' if nav.startswith('/bulletins') else '' }}">公告</a>
    </nav>
    <button type="button" class="theme-toggle" data-theme-toggle aria-label="主题：自动" title="主题：自动">主题：自动</button>
  </header>
  <main class="main">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    只读视图 · 访问受 IP 白名单约束 · 判定逻辑仍由 CLI ingest/scan 执行
  </footer>
  <script>
  (function () {
    var THEME_MODES = ["auto", "light", "dark"];
    var THEME_LABELS = { auto: "自动", light: "浅色", dark: "深色" };

    function currentThemeMode() {
      var t = null;
      try { t = localStorage.getItem("msw-theme"); } catch (e) { t = null; }
      if (t !== "light" && t !== "dark") return "auto";
      return t;
    }

    function applyThemeMode(mode) {
      var root = document.documentElement;
      if (mode === "auto") {
        root.removeAttribute("data-theme");
        try { localStorage.removeItem("msw-theme"); } catch (e) {}
      } else {
        root.setAttribute("data-theme", mode);
        try { localStorage.setItem("msw-theme", mode); } catch (e) {}
      }
      var btn = document.querySelector("[data-theme-toggle]");
      if (btn) {
        var label = THEME_LABELS[mode] || "自动";
        var text = "主题：" + label;
        btn.setAttribute("aria-label", text);
        btn.setAttribute("title", text);
        btn.textContent = text;
      }
    }

    var themeBtn = document.querySelector("[data-theme-toggle]");
    if (themeBtn) {
      themeBtn.addEventListener("click", function () {
        var cur = currentThemeMode();
        var next = THEME_MODES[(THEME_MODES.indexOf(cur) + 1) % THEME_MODES.length];
        applyThemeMode(next);
      });
      applyThemeMode(currentThemeMode());
    }

    if (window.matchMedia) {
      var mq = window.matchMedia("(prefers-color-scheme: dark)");
      var onMq = function () {
        if (currentThemeMode() === "auto") applyThemeMode("auto");
      };
      try {
        if (mq.addEventListener) {
          mq.addEventListener("change", onMq);
        } else if (mq.addListener) {
          mq.addListener(onMq);
        }
      } catch (e) {}
    }

    function openDetailsForPrint() {
      var nodes = document.querySelectorAll("details.fold");
      var prev = [];
      nodes.forEach(function (el) {
        prev.push(el.open);
        el.open = true;
      });
      return function restore() {
        nodes.forEach(function (el, i) {
          el.open = prev[i];
        });
      };
    }

    function printPdf() {
      var restore = openDetailsForPrint();
      var finished = false;
      var done = function () {
        if (finished) return;
        finished = true;
        restore();
        window.removeEventListener("afterprint", done);
      };
      window.addEventListener("afterprint", done);
      window.print();
    }

    document.querySelectorAll("[data-print-pdf]").forEach(function (btn) {
      btn.addEventListener("click", function (ev) {
        ev.preventDefault();
        printPdf();
      });
    });

    document.querySelectorAll("[data-notify-url]").forEach(function (btn) {
      btn.addEventListener("click", function (ev) {
        ev.preventDefault();
        var url = btn.getAttribute("data-notify-url");
        var msg = btn.getAttribute("data-notify-confirm") || "确认发送到企微？";
        if (!url || !window.confirm(msg)) return;
        btn.disabled = true;
        fetch(url, { method: "POST", headers: { Accept: "application/json" } })
          .then(function (res) {
            return res.json().then(function (data) {
              return { ok: res.ok && data && data.ok, message: (data && data.message) || res.statusText };
            });
          })
          .then(function (result) {
            window.alert(result.message || (result.ok ? "已发送" : "发送失败"));
          })
          .catch(function (err) {
            window.alert("发送失败：" + (err && err.message ? err.message : err));
          })
          .finally(function () {
            btn.disabled = false;
          });
      });
    });

    if (new URLSearchParams(window.location.search).get("print") === "1") {
      window.addEventListener("load", function () {
        printPdf();
        if (window.history && window.history.replaceState) {
          var u = new URL(window.location.href);
          u.searchParams.delete("print");
          window.history.replaceState({}, "", u.pathname + u.search + u.hash);
        }
      });
    }
  })();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
