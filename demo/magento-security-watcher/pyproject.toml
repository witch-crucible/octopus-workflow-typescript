[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "magento-security-watcher"
version = "0.1.0"
description = "Magento2 security advisory ingest, RiskItem analysis, and project scan watcher"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "click>=8.1",
  "httpx>=0.27",
  "packaging>=24.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "eval-type-backport>=0.2.0",
  "pyyaml>=6.0",
  "rich>=13.7",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.scripts]
msw = "magento_security_watcher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
magento_security_watcher = [
  "web/templates/*.html",
  "web/templates/**/*.html",
  "web/static/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
