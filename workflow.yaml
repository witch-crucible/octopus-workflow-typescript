version: 2
name: Octopus Software Delivery
nodeIdMapping:
  requirements-analysis-and-brd-design: '10.1'
  brd-walkthrough: '10.2'
  requirements-research: '10.3'
  prd-design-and-boundary-analysis: '10.4'
  prd-walkthrough: '10.5'
  ai-meeting-minutes: '10.6'
  prd-review-and-feature-breakdown: '10.7'
  prd-effort-estimation: '10.8'
  ai-requirements-analysis: '10.9'
  ai-effort-summary: '10.10'
  effort-estimate-sync: '10.11'
  developer-effort-confirmation: '10.12'
  requirements-scheduling: '20.1'
  kickoff-review: '20.2'
  ai-kickoff-summary: 20.2a
  requirements-walkthrough: '20.3'
  developer-prd-recap: '20.4'
  teambition-task-breakdown: '20.5'
  impact-scope-assessment: '20.6'
  frontend-backend-alignment: '20.7'
  technical-design-authoring: '20.8'
  technical-design-consolidation: '30.1'
  ai-setup-checklist-validation: '30.2'
  technical-design-review-chain: '30.3'
  ai-technical-design-review: '30.4'
  test-case-design-and-review: '30.5'
  data-and-api-design: '30.6'
  feature-development: '30.7'
  checklist-update-and-integration: '30.8'
  environment-validation-and-documentation: '30.9'
  self-test-and-code-quality: '30.10'
  weekly-feature-demo: '30.11'
  smoke-demo-validation: '40.1'
  functional-and-performance-testing: '40.2'
  uat-and-user-acceptance: '40.3'
  release-plan-creation: '40.4'
  environment-deployment: '50.1'
  branch-merge: '50.2'
  ai-checklist-recommendation: '50.3'
  sonar-and-code-review: '50.4'
  ai-code-review: '50.5'
  postman-and-test-script-generation: '50.6'
  sql-execution-and-risk-check: '50.7'
  magento-release-risk-assessment: '50.8'
  regression-testing: '50.9'
  ab-validation-and-branch-merge: '50.10'
  ai-technical-debt-quantification: '60.1'
  service-monitoring: '60.2'
  generate-documentation: 10.doc
nodes:
  - key: requirements-analysis-and-brd-design
    phase: Intention
    name: Requirements Analysis and BRD Design
    description: PM analyzes requirements and completes the BRD
    responsibleRoles:
      - PM
    dependsOn: []
    actions:
      - type: manual
        instructions: >-
          Configure project BRD sources and prompts (octopus brd config / Web settings),
          then run octopus brd generate or octopus brd check. Confirm brd.md before completing this node.
  - key: brd-walkthrough
    phase: Intention
    name: BRD Walkthrough
    description: PM walks BA through the BRD
    responsibleRoles:
      - PM
      - BA
    dependsOn:
      - requirements-analysis-and-brd-design
    actions:
      - type: manual
  - key: requirements-research
    phase: Research
    name: Requirements Research
    description: SA researches technical feasibility, delivery time, and cost
    responsibleRoles:
      - SA
    dependsOn:
      - brd-walkthrough
    actions:
      - type: manual
  - key: prd-design-and-boundary-analysis
    phase: Research
    name: PRD and Boundary Design
    description: BA designs the PRD and validates boundary cases
    responsibleRoles:
      - BA
    dependsOn:
      - requirements-research
    actions:
      - type: manual
  - key: prd-walkthrough
    phase: Research
    name: PRD Walkthrough
    description: BA walks PM, DEV, and SA through the PRD
    responsibleRoles:
      - BA
      - PM
      - DEV
      - SA
    dependsOn:
      - prd-design-and-boundary-analysis
    actions:
      - type: manual
  - key: ai-meeting-minutes
    phase: Research
    name: AI Meeting Minutes
    description: AI generates meeting minutes from the recorded discussion
    responsibleRoles:
      - AI
    dependsOn:
      - prd-walkthrough
    actions:
      - type: ai
        assistant: MEETING_MINUTES
  - key: prd-review-and-feature-breakdown
    phase: Research
    name: PRD Review and Feature Breakdown
    description: SA reviews the PRD and breaks it into feature units
    responsibleRoles:
      - SA
    dependsOn:
      - prd-walkthrough
    actions:
      - type: manual
  - key: prd-effort-estimation
    phase: Research
    name: PRD Effort Estimation
    description: SA estimates each feature unit at no more than two hours
    responsibleRoles:
      - SA
    dependsOn:
      - prd-review-and-feature-breakdown
    actions:
      - type: manual
  - key: ai-requirements-analysis
    phase: Research
    name: AI Requirements Analysis
    description: >-
      AI analyzes and decomposes requirements using project code, wiki pages,
      and mind maps
    responsibleRoles:
      - SA
      - AI
    dependsOn:
      - prd-review-and-feature-breakdown
    actions:
      - type: ai
        assistant: REQUIREMENTS_ANALYSIS
  - key: ai-effort-summary
    phase: Research
    name: AI Effort Summary
    description: AI summarizes effort from the detailed Excel estimate
    responsibleRoles:
      - AI
    dependsOn:
      - prd-effort-estimation
    actions:
      - type: ai
        assistant: EFFORT_ESTIMATION
  - key: effort-estimate-sync
    phase: Research
    name: Effort Estimate Sync
    description: SA shares the effort estimate with PM and DEV
    responsibleRoles:
      - SA
      - PM
      - DEV
    dependsOn:
      - ai-effort-summary
    actions:
      - type: manual
  - key: developer-effort-confirmation
    phase: Research
    name: Developer Effort Confirmation
    description: DEV confirms the effort estimate
    responsibleRoles:
      - DEV
    dependsOn:
      - effort-estimate-sync
    actions:
      - type: manual
  - key: requirements-scheduling
    phase: Design
    name: Requirements Scheduling
    description: PM schedules the approved requirements
    responsibleRoles:
      - PM
    dependsOn: []
    actions:
      - type: manual
  - key: kickoff-review
    phase: Design
    name: Kickoff Review
    description: The team reviews requirements with a recording and AI summary
    responsibleRoles:
      - PM
      - BA
      - SA
      - DEV
      - QA
    dependsOn:
      - requirements-scheduling
    actions:
      - type: manual
  - key: ai-kickoff-summary
    phase: Design
    name: AI Kickoff Summary
    description: AI summarizes the kickoff recording
    responsibleRoles:
      - AI
    dependsOn:
      - kickoff-review
    actions:
      - type: ai
        assistant: MEETING_MINUTES
  - key: requirements-walkthrough
    phase: Design
    name: Requirements Walkthrough
    description: BA explains the requirements to PM, SA, DEV, and QA
    responsibleRoles:
      - BA
      - PM
      - SA
      - DEV
      - QA
    dependsOn:
      - kickoff-review
    actions:
      - type: manual
  - key: developer-prd-recap
    phase: Design
    name: Developer PRD Recap
    description: DEV restates the PRD understanding and reports questions to SA and BA
    responsibleRoles:
      - DEV
      - SA
      - BA
    dependsOn:
      - requirements-walkthrough
    actions:
      - type: manual
  - key: teambition-task-breakdown
    phase: Design
    name: Teambition Task Breakdown
    description: PM splits the work into Teambition tasks of no more than four hours
    responsibleRoles:
      - PM
    dependsOn:
      - developer-prd-recap
    actions:
      - type: integration
        service: teambition
        operation: splitTasks
  - key: impact-scope-assessment
    phase: Design
    name: Impact Scope Assessment
    description: DEV assesses the affected scope and shares it with SA and QA
    responsibleRoles:
      - DEV
      - SA
      - QA
    dependsOn:
      - teambition-task-breakdown
    actions:
      - type: manual
  - key: frontend-backend-alignment
    phase: Design
    name: Frontend and Backend Alignment
    description: >-
      DEV aligns frontend and backend implementation plans and records the
      decisions
    responsibleRoles:
      - DEV
    dependsOn:
      - impact-scope-assessment
    actions:
      - type: manual
  - key: technical-design-authoring
    phase: Design
    name: Technical Design Authoring
    description: >-
      DEV documents frontend and backend designs, including APIs, ER models,
      flows, and PDL
    responsibleRoles:
      - DEV
    dependsOn:
      - frontend-backend-alignment
    actions:
      - type: manual
  - key: technical-design-consolidation
    phase: Implementation
    name: Technical Design Consolidation
    description: DEV consolidates the technical design and verifies the estimate
    responsibleRoles:
      - DEV
    dependsOn: []
    actions:
      - type: manual
  - key: ai-setup-checklist-validation
    phase: Implementation
    name: AI Setup Checklist Validation
    description: AI validates domain, Nginx, PHP, payment, and related setup
    responsibleRoles:
      - SA
      - AI
    dependsOn:
      - technical-design-consolidation
    actions:
      - type: ai
        assistant: SETUP_CHECKLIST_CHECK
  - key: technical-design-review-chain
    phase: Implementation
    name: Technical Design Review Chain
    description: DEV, SA, BA, and PM review the technical design in sequence
    responsibleRoles:
      - DEV
      - SA
      - BA
      - PM
    dependsOn:
      - technical-design-consolidation
    actions:
      - type: manual
  - key: ai-technical-design-review
    phase: Implementation
    name: AI Technical Design Review
    description: AI scores architecture quality and predicts security and performance risks
    responsibleRoles:
      - AI
    dependsOn:
      - technical-design-review-chain
    actions:
      - type: ai
        assistant: TECH_DESIGN_REVIEW
  - key: test-case-design-and-review
    phase: Implementation
    name: Test Case Design and Review
    description: QA writes test cases and organizes their review
    responsibleRoles:
      - QA
      - DEV
      - SA
      - PM
    dependsOn:
      - ai-technical-design-review
    actions:
      - type: manual
  - key: data-and-api-design
    phase: Implementation
    name: Data and API Design
    description: DEV designs data structures, APIs, and user interfaces
    responsibleRoles:
      - DEV
      - SA
    dependsOn:
      - test-case-design-and-review
    actions:
      - type: manual
  - key: feature-development
    phase: Implementation
    name: Feature Development
    description: DEV implements the feature and creates its main task branch
    responsibleRoles:
      - DEV
    dependsOn:
      - data-and-api-design
    actions:
      - type: heinrich
        delta: 1
  - key: checklist-update-and-integration
    phase: Implementation
    name: Checklist Update and Integration
    description: DEV updates the checklist and completes integration testing
    responsibleRoles:
      - DEV
    dependsOn:
      - feature-development
    actions:
      - type: manual
  - key: environment-validation-and-documentation
    phase: Implementation
    name: Environment Validation and AI Documentation
    description: >-
      SA confirms the environment and AI generates or extends the technical
      documentation
    responsibleRoles:
      - SA
      - AI
    dependsOn:
      - checklist-update-and-integration
    actions:
      - type: ai
        assistant: DOCUMENT_SYNC
        input: >-
          Generate complete technical documentation from the current project
          code and changes. Preserve valid existing content and extend changed
          sections. Return only the complete Markdown document.
        outputFile: documentation.md
        ifExists: extend
  - key: self-test-and-code-quality
    phase: Implementation
    name: Self-Test and Code Quality
    description: >-
      DEV completes self-testing, Sonar analysis, vulnerability scanning, and
      CodeCheck
    responsibleRoles:
      - DEV
    dependsOn:
      - environment-validation-and-documentation
    actions:
      - type: integration
        service: sonar
        operation: runScan
      - type: heinrich
        delta: 1
  - key: weekly-feature-demo
    phase: Implementation
    name: Weekly Feature Demo
    description: SA runs the weekly feature demo and code quality review
    responsibleRoles:
      - SA
      - DEV
    dependsOn:
      - self-test-and-code-quality
    actions:
      - type: manual
  - key: smoke-demo-validation
    phase: Testing
    name: Smoke Demo Validation
    description: DEV validates the smoke demo with QA
    responsibleRoles:
      - DEV
      - QA
    dependsOn: []
    actions:
      - type: heinrich
        delta: 1
  - key: functional-and-performance-testing
    phase: Testing
    name: Functional and Performance Testing
    description: QA performs functional and performance testing
    responsibleRoles:
      - QA
    dependsOn:
      - smoke-demo-validation
    actions:
      - type: manual
  - key: uat-and-user-acceptance
    phase: UAT
    name: UAT and User Acceptance
    description: QA prepares UAT cases and OP performs user acceptance testing
    responsibleRoles:
      - QA
      - OP
    dependsOn:
      - functional-and-performance-testing
    actions:
      - type: manual
  - key: release-plan-creation
    phase: UAT
    name: Release Plan Creation
    description: OP creates the release plan at least three days in advance
    responsibleRoles:
      - OP
    dependsOn:
      - uat-and-user-acceptance
    actions:
      - type: manual
  - key: environment-deployment
    phase: Release
    name: Environment Deployment
    description: >-
      SA deploys the complete domain, CDN, WAF, SLB, ECS, and related
      environment configuration
    responsibleRoles:
      - SA
    dependsOn: []
    actions:
      - type: manual
  - key: branch-merge
    phase: Release
    name: Branch Merge
    description: SA merges the release branches
    responsibleRoles:
      - SA
      - DEV
    dependsOn:
      - environment-deployment
    actions:
      - type: integration
        service: git
        operation: mergeBranches
      - type: heinrich
        delta: 1
  - key: ai-checklist-recommendation
    phase: Release
    name: AI Checklist Recommendation
    description: AI recommends checklist additions for review by SA, BA, DEV, PM, and QA
    responsibleRoles:
      - SA
      - BA
      - DEV
      - PM
      - QA
      - AI
    dependsOn:
      - branch-merge
    actions:
      - type: ai
        assistant: CHECKLIST_RECOMMENDATION
  - key: sonar-and-code-review
    phase: Release
    name: Sonar and Code Review
    description: SA runs Sonar and DEV performs code review
    responsibleRoles:
      - SA
      - DEV
    dependsOn:
      - ai-checklist-recommendation
    actions:
      - type: integration
        service: sonar
        operation: runScan
      - type: heinrich
        delta: 1
  - key: ai-code-review
    phase: Release
    name: AI Code Review
    description: >-
      AI generates UML sequence diagrams and control-flow graphs, then scores
      change risk
    responsibleRoles:
      - AI
    dependsOn:
      - sonar-and-code-review
    actions:
      - type: ai
        assistant: CODE_REVIEW
  - key: postman-and-test-script-generation
    phase: Release
    name: Postman and Test Script Generation
    description: SA runs Postman and AI generates automated test scripts
    responsibleRoles:
      - SA
      - AI
    dependsOn:
      - ai-code-review
    actions:
      - type: integration
        service: postman
        operation: runCollection
      - type: ai
        assistant: TEST_SCRIPT_GENERATION
      - type: heinrich
        delta: 1
  - key: sql-execution-and-risk-check
    phase: Release
    name: SQL Execution and Risk Check
    description: >-
      SA and DEV execute SQL while AI detects missing indexes, table locks, and
      non-reversible changes
    responsibleRoles:
      - SA
      - DEV
      - AI
    dependsOn:
      - postman-and-test-script-generation
    actions:
      - type: ai
        assistant: SQL_RISK_CHECK
      - type: heinrich
        delta: 1
  - key: magento-release-risk-assessment
    phase: Release
    name: Magento Release Risk Assessment
    description: SA performs the release and AI assesses release risk in advance
    responsibleRoles:
      - SA
      - AI
    dependsOn:
      - sql-execution-and-risk-check
    actions:
      - type: ai
        assistant: RELEASE_RISK_ASSESSMENT
  - key: regression-testing
    phase: Release
    name: Regression Testing
    description: QA performs regression testing
    responsibleRoles:
      - QA
    dependsOn:
      - magento-release-risk-assessment
    actions:
      - type: manual
  - key: ab-validation-and-branch-merge
    phase: Release
    name: AB Validation and Branch Merge
    description: >-
      PM validates the AB test and merges the production branch back into
      development
    responsibleRoles:
      - PM
    dependsOn:
      - regression-testing
    actions:
      - type: manual
  - key: ai-technical-debt-quantification
    phase: Maintenance
    name: AI Technical Debt Quantification
    description: >-
      AI scores code complexity, duplication, and dependency age to prioritize
      technical debt
    responsibleRoles:
      - AI
    dependsOn: []
    actions:
      - type: ai
        assistant: TECH_DEBT_QUANTIFICATION
  - key: service-monitoring
    phase: Maintenance
    name: Service Monitoring
    description: DEV monitors the service across daily, weekly, and yearly windows
    responsibleRoles:
      - DEV
    dependsOn:
      - ai-technical-debt-quantification
    actions:
      - type: integration
        service: monitoring
        operation: registerAlert
  - key: generate-documentation
    phase: Research
    name: Generate Documentation
    description: Generate or extend complete technical documentation from the project source code
    responsibleRoles:
      - AI
    dependsOn:
      - requirements-analysis-and-brd-design
    actions:
      - type: ai
        assistant: DOCUMENT_SYNC
        input: Generate complete technical documentation from the project source code. Preserve valid existing content and extend changed sections.
        outputFile: documentation.md
        ifExists: extend
