<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <meta name="color-scheme" content="dark" />
    <title>Octopus Workflow</title>
    <style>
      :root { color-scheme: dark; --bg: #09111f; --panel: #111c2e; --panel2: #18263d; --line: #2a3d5e; --muted: #8da1bf; --text: #eef5ff; --blue: #55a7ff; --green: #47d7a1; --red: #ff6b7a; --orange: #ffc36b; }
      * { box-sizing: border-box; }
      body { margin: 0; background: radial-gradient(circle at top right, #162f52, var(--bg) 45%); color: var(--text); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; }
      header { height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; border-bottom: 1px solid var(--line); background: rgba(9,17,31,.82); backdrop-filter: blur(14px); }
      header h1 { margin: 0; font-size: 18px; letter-spacing: .02em; }
      header .pulse { color: var(--green); font-size: 12px; }
      main { display: grid; grid-template-columns: 270px 1fr 330px; height: calc(100vh - 64px); }
      aside, section { min-width: 0; }
      .sidebar, .inspector { padding: 18px; background: rgba(17,28,46,.86); border-right: 1px solid var(--line); overflow: auto; }
      .inspector { border-right: 0; border-left: 1px solid var(--line); }
      .content { display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
      .toolbar { display: flex; gap: 8px; padding: 14px 18px; border-bottom: 1px solid var(--line); background: rgba(17,28,46,.6); }
      input, button { font: inherit; border-radius: 8px; border: 1px solid var(--line); padding: 8px 10px; color: var(--text); background: var(--panel2); }
      input { width: 100%; }
      button { cursor: pointer; background: #1e4f82; border-color: #2d75b8; }
      button:hover { background: #28679e; }
      button.secondary { background: transparent; border-color: var(--line); }
      button.danger { background: #6a2638; border-color: #a9485e; }
      .row { display: flex; gap: 8px; margin-bottom: 10px; }
      .row button { white-space: nowrap; }
      h2, h3 { margin: 8px 0 12px; }
      h2 { font-size: 16px; }
      h3 { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
      .project { padding: 9px 10px; border: 1px solid transparent; border-radius: 8px; cursor: pointer; font-family: ui-monospace, monospace; font-size: 12px; overflow: hidden; text-overflow: ellipsis; }
      .project:hover, .project.active { border-color: #31547e; background: #182d49; }
      .muted { color: var(--muted); }
      .summary { display: flex; gap: 10px; padding: 14px 18px 0; flex-wrap: wrap; }
      .metric { min-width: 115px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: rgba(24,38,61,.7); }
      .metric strong { display: block; font-size: 20px; }
      .metric small { color: var(--muted); }
      .graph-wrap { flex: 1; overflow: auto; padding: 18px; }
      #graph { min-width: 900px; min-height: 520px; width: 100%; height: 100%; border: 1px solid var(--line); border-radius: 14px; background: linear-gradient(180deg, rgba(24,38,61,.62), rgba(9,17,31,.45)); }
      .edge { stroke: #49698f; stroke-width: 2; opacity: .7; }
      .edge.active { stroke: var(--blue); stroke-width: 3; opacity: 1; }
      .node rect { stroke: #527096; stroke-width: 1.5; fill: #172943; }
      .node text { pointer-events: none; fill: var(--text); font-size: 12px; }
      .node .id { fill: var(--muted); font-size: 10px; }
      .node.ready rect { stroke: var(--blue); filter: drop-shadow(0 0 7px rgba(85,167,255,.45)); }
      .node.running rect { stroke: #b58cff; fill: #392d64; filter: drop-shadow(0 0 11px rgba(181,140,255,.6)); }
      .node.completed rect { stroke: var(--green); fill: #163d3a; }
      .node.blocked rect { stroke: var(--red); fill: #4a2334; }
      .node.waiting rect { stroke: var(--orange); fill: #493a25; }
      .node.selected rect { stroke: #fff; stroke-width: 3; }
      .phase-label { fill: var(--muted); font-size: 12px; letter-spacing: .08em; }
      .badge { display: inline-block; padding: 3px 7px; border-radius: 999px; background: #203553; color: var(--muted); font-size: 11px; }
      .badge.good { color: var(--green); background: #163d3a; }
      .badge.warn { color: var(--orange); background: #493a25; }
      .badge.bad { color: var(--red); background: #4a2334; }
      .detail { padding: 12px; background: var(--panel2); border-radius: 10px; margin-top: 12px; }
      .detail dt { color: var(--muted); font-size: 11px; margin-top: 9px; }
      .detail dd { margin: 2px 0 0; word-break: break-word; }
      .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
      pre { white-space: pre-wrap; word-break: break-word; max-height: 220px; overflow: auto; padding: 10px; background: #07101d; border-radius: 8px; color: #bfd5f2; font-size: 11px; }
    </style>
  </head>
  <body>
    <header><h1>🐙 Octopus Workflow <span class="pulse">● live monitor</span></h1><span id="workflowStatus" class="badge">未选择项目</span></header>
    <main>
      <aside class="sidebar">
        <div id="initPanel">
          <h3>创建项目</h3>
          <input id="name" placeholder="项目名称" />
          <div class="row"><input id="desc" placeholder="描述（可选）" /><button id="create">创建</button></div>
          <input id="root" placeholder="源码根目录（可选）" />
        </div>
        <h3 style="margin-top:22px">项目</h3><div id="projects"></div>
      </aside>
      <section class="content">
        <div class="toolbar"><button id="runWorkflow">▶ 运行可运行节点</button><button id="health" class="secondary">♥ 健康检查</button><button id="exportTasks" class="secondary">导出任务</button><button id="importTasks" class="secondary">导入任务</button><button id="refresh" class="secondary">↻ 刷新</button><span id="lastUpdate" class="muted" style="margin-left:auto"></span></div>
        <div class="summary" id="summary"></div>
        <div class="graph-wrap"><svg id="graph" viewBox="0 0 1200 720" role="img" aria-label="工作流节点图"></svg></div>
      </section>
      <aside class="inspector"><h2>节点详情</h2><p id="empty" class="muted">点击图中的节点查看详情。</p><div id="details"></div></aside>
    </main>
    <script src="browser-api.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
